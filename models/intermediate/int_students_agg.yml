version: 2

models:
  - name: int_students_agg
    description: >
      Agrégation des inscriptions étudiants par région, tranche d'âge, genre et année.
      Le USER_ID disparaît à cette étape par agrégation — conformité RGPD assurée.
      Les tables en aval ne contiennent aucune donnée permettant d'identifier un individu.
      Grain : une ligne par région / tranche d'âge / genre / année.
    columns:
      - name: REGION
        description: "Région de résidence de l'étudiant."
        tests:
          - not_null
      - name: AGE_GROUP
        description: "Tranche d'âge de l'étudiant."
        tests:
          - not_null
      - name: GENDER
        description: "Genre de l'étudiant (F, M ou Non renseigné)."
        tests:
          - not_null
      - name: YEAR
        description: "Année de début du parcours."
        tests:
          - not_null
      - name: NB_INSCRIPTIONS
        description: "Nombre total d'inscriptions pour ce segment."
        tests:
          - not_null